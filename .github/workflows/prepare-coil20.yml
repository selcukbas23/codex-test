name: Prepare COIL-20 dataset

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OUT_DIR: coil20_dataset

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official processed COIL-20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          URL='https://www.cs.columbia.edu/CAVE/databases/SLAM_coil-20_coil-100/coil-20/coil-20-proc.zip'
          curl --fail --location --retry 8 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "$URL" -o "$OUT_DIR/coil-20-proc.zip"

      - name: Verify archive and image count
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$OUT_DIR/coil-20-proc.zip"
          mkdir -p "$OUT_DIR/extracted"
          unzip -q "$OUT_DIR/coil-20-proc.zip" -d "$OUT_DIR/extracted"
          count=$(find "$OUT_DIR/extracted" -type f \( -iname '*.png' -o -iname '*.ppm' -o -iname '*.jpg' \) | wc -l)
          test "$count" -eq 1440
          sha256sum "$OUT_DIR/coil-20-proc.zip" > "$OUT_DIR/SHA256SUMS.txt"
          printf 'source=%s\nimages=%s\n' \
            'Columbia CAVE processed COIL-20' "$count" > "$OUT_DIR/MANIFEST.txt"

      - name: Upload verified COIL-20
        uses: actions/upload-artifact@v4
        with:
          name: verified-coil20-processed
          path: coil20_dataset
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
